name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test --run
      # Valida o mesmo bundle OpenNext usado pelos deploys Cloudflare.
      - run: bun run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Preparar bundle do Cloudflare Pages
        # também roda em disparo manual: se o GitHub Actions estiver fora do ar na
        # hora do merge, o push não gera run nenhum e a publicação some — aí a
        # única saída era um commit vazio só pra reativar o deploy.
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: bun scripts/prepare-pages-worker.ts
      - name: Publicar tindoapp.pages.dev
        # também roda em disparo manual: se o GitHub Actions estiver fora do ar na
        # hora do merge, o push não gera run nenhum e a publicação some — aí a
        # única saída era um commit vazio só pra reativar o deploy.
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: bunx wrangler pages deploy .open-next/assets --project-name=tindoapp --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
