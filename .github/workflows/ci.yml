name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test --run
      # Só valida que o build de produção (mesmo comando que a integração
      # nativa do Cloudflare roda: bun run cf:build) passa — o deploy em
      # si acontece sozinho, disparado pelo próprio Cloudflare a cada push
      # no main (ver "Build" nas Configurações do Worker "tindo" no painel
      # Cloudflare), sem depender deste workflow.
      - run: bun run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # O app lê NEXT_PUBLIC_SUPABASE_ANON_KEY (src/lib/supabase/client.ts);
          # o secret SUPABASE_ANON_KEY existe no repo, mas está vazio.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
