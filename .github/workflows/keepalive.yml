name: Keep Supabase Alive

# O plano Free do Supabase pausa projetos com POUCA atividade de banco em 7 dias.
# A doc oficial diz que o típico necessário é "a few user requests to the database
# each day" — 1 query/dia não bastou (aviso de pausa chegou em 2026-07-28 mesmo com
# o keep-alive diário passando). Por isso: 4 execuções/dia × 6 queries cada.
# Direto no Supabase, sem passar pelo app, para não depender do deploy do Cloudflare.
# Repositório público: minutos de Actions são gratuitos e ilimitados.

on:
  schedule:
    # 4x/dia (minuto quebrado evita a fila das horas cheias)
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query no Supabase (mantém o banco ativo)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Secret ausente vira string vazia e o erro só apareceria como 401 confuso.
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Secrets NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY não configurados no repositório."
            exit 1
          fi
          # Várias queries por execução: o critério do Supabase é volume de atividade,
          # não presença de 1 request. Tabelas diferentes para gerar queries distintas.
          # (sem "lembretes": essa tabela não existe na API — retorna 404)
          for TABELA in tarefas projetos tags historico_acoes tarefas projetos; do
            STATUS=$(curl -sS -o /tmp/resposta.txt -w '%{http_code}' \
              --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors \
              "${SUPABASE_URL}/rest/v1/${TABELA}?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            echo "${TABELA}: HTTP ${STATUS}"
            # 200 (query rodou, RLS pode devolver lista vazia) é o único resultado saudável.
            if [ "${STATUS}" != "200" ]; then
              head -c 200 /tmp/resposta.txt || true
              echo "::error::Supabase respondeu ${STATUS} em ${TABELA} — projeto pode estar pausado ou a chave expirou."
              exit 1
            fi
            sleep 2
          done

      - name: Evita auto-disable do cron pelo GitHub (60 dias sem commit)
        run: |
          set -euo pipefail
          DIAS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Último commit há ${DIAS} dias."
          if [ "${DIAS}" -ge 45 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore(keepalive): mantém o cron do Actions ativo [skip ci]'
            git push
          fi
